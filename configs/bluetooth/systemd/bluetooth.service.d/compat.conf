# Run bluetoothd with --compat so the legacy SDP server socket
# (/var/run/sdp) exists - the ported bt-spp tool registers its
# Serial Port Profile service through it.  Inert when the bluez
# package is not installed (add "bluez" via PACKAGES /
# PROFILE_PACKAGES to get bluetoothd at all).
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --compat
