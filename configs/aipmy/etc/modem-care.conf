# /etc/modem-care.conf - switches and tunables for the modem-care
# services (see docs/modem-care.md).  Managed by hand or via the
# `modem-care` CLI (modem-care enable|disable <name> also starts/stops
# the service).  This file is sourced as shell; keep KEY=value lines.
#
# Service enablement at boot is controlled by the init system
# (systemctl enable / rc-update); the *_ENABLED keys below are a
# second, in-daemon gate the daemons check before doing any work.

# --- service gates ---------------------------------------------------
MODEM_LED_ENABLED=yes          # modem-led-monitor  (default ON)
WIFI_LED_ENABLED=yes           # wifi-led-monitor   (default ON)
SIM_HOTPLUG_ENABLED=yes        # sim-hotplug        (default ON)
BEARER_WATCHDOG_ENABLED=no     # modem-bearer-watchdog (default OFF:
                               # it can restart the data connection)
HIMI_OK_ENABLED=no             # himi-ok-guard      (default OFF)

# --- LED monitors ----------------------------------------------------
LED_CHECK_INTERVAL=2           # seconds between health polls
MODEM_LED=auto                 # /sys/class/leds/<name> or "auto" (first *red*)
WIFI_LED=auto                  # /sys/class/leds/<name> or "auto" (first *wlan*)

# --- sim-hotplug ------------------------------------------------------
SIM_PULSE_LED=auto             # LED node used as the sim re-announce line:
                               # a name under /sys/class/leds, or "auto"
                               # (uses "sim_hotplug" if the board has one,
                               # otherwise the service runs monitor-only)
SIM_IDLE_INTERVAL=60           # s between UIM checks while registered
SIM_ACTIVE_INTERVAL=10         # s between UIM checks while searching
SIM_ABSENT_INTERVAL=20         # s between re-announce cycles while absent
SIM_PULSE_MS=300               # re-announce pulse width

# --- bearer watchdog (only used when BEARER_WATCHDOG_ENABLED=yes) -----
WATCHDOG_CHECK_INTERVAL=5      # s between samples
WATCHDOG_STALL_TIMEOUT=30      # s of TX-without-RX before probing
WATCHDOG_PROBE_TARGET=1.1.1.1  # connectivity probe target
WATCHDOG_COOLDOWN=300          # s between recovery attempts
WATCHDOG_ZOMBIE_SECS=60        # s with no modem object before a nudge

# --- himi-ok guard (only used when HIMI_OK_ENABLED=yes) ---------------
HIMI_OK_INTERVAL=20            # s between NV item 2500 checks
HIMI_OK_BOARDS="*uz801* *uf896* *ufi001c* *uf02* *hmuf02v5*"  # DT compatible globs
