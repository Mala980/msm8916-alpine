# /etc/carrier-autocfg.conf - qcom-carrier-autocfg configuration.
# Managed by hand or via `carrier-autocfg set|auto|off` (see
# docs/carrier-autocfg.md).  Sourced as shell; keep KEY=value lines.

# Master switch.  Default is "no": the carrier-autocfg boot service is
# installed but completely inert until this is turned on.
ENABLED=no

# auto   = detect the inserted SIM's operator and apply its profile
# manual = always apply the CARRIER profile below
MODE=auto

# Manual carrier: an MCC-MNC code (e.g. 51010) or an operator name
# from `carrier-autocfg list`.  Only used when MODE=manual.
CARRIER=

# NetworkManager connection whose [gsm] APN / IP type get provisioned.
NM_CONN=lte

# Directory with per-carrier MCFG (MBN) payloads, laid out like
# upstream: <region>/<carrier>/<variant>/mcfg_sw.mbn.  NOTE: carrier
# MBN *activation* is deliberately not performed (see
# docs/carrier-autocfg.md - activating an MCFG resets the modem, and
# upstream disabled it after it caused crash loops).  The blobs are
# also not vendored in the image; drop them here if you keep local
# copies for reference.
MBN_DIR=/usr/share/carrier-autocfg/mcfg
