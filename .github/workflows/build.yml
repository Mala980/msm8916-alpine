name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  PASSWORD: "debian-ci"
  WIFI_SSID: "test"
  WIFI_PASS: "testpass"
  DTB_FILE: "msm8916-yiming-uz801v3.dtb"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo sh -e scripts/build-deps.sh

      - name: Compile DTS
        run: |
          mkdir -p files
          sudo ./scripts/build-dtb.sh ./files

      - name: Build rootfs
        # sudo -E is ignored on current runners; pass the workflow env
        # explicitly through `env` so PASSWORD/WIFI/DTB reach the script
        run: sudo env PASSWORD="$PASSWORD" WIFI_SSID="$WIFI_SSID" WIFI_PASS="$WIFI_PASS" DTB_FILE="$DTB_FILE" bash scripts/build-rootfs.sh ./files

      - name: Build images
        run: sudo bash ./scripts/build-images.sh ./files

      - name: Build firmware
        run: sudo bash ./scripts/build-firmware.sh files/firmware.zip

      - name: Generate GPT table
        run: sudo bash ./scripts/build-gpt.sh files/gpt_both0.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msm8916-debian-armv7
          path: |
            files/firmware.zip
            files/gpt_both0.bin
            files/rootfs.img.gz
            files/boot.img.gz

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            files/firmware.zip \
            files/gpt_both0.bin \
            files/rootfs.img.gz \
            files/boot.img.gz \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
